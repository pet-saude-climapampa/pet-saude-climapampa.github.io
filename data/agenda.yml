#   id            nome curto, sem espaços nem acentos (ex.: oficina-mapas)
#   tipo          Seminário, Minicurso, Oficina, Reunião, Roda de conversa...
#   titulo        só o nome da atividade (o tipo já aparece acima dele; não repita "Seminário sobre...")
#   data          AAAA-MM-DD            inicio / fim   "19:00" (fim é opcional)
#   modalidade    "On-line, Google Meet"  ou  "Presencial, Salão de Atos"
#   certificacao  curto: "Certificado de horas" (opcional)
#   resumo        1 ou 2 frases: do que se trata e quem pode participar
