# Agenda de atividades do ClimaPampa  —  MODELO ÚNICO: copie um bloco, preencha e publique.
# A ordem não importa: o site separa "Próximas atividades" e "Realizadas" pela data (atualiza todo dia à meia-noite).
#
#   id            nome curto, sem espaços nem acentos (ex.: oficina-mapas)
#   tipo          Seminário, Minicurso, Oficina, Reunião, Roda de conversa...
#   titulo        só o nome da atividade (o tipo já aparece acima dele; não repita "Seminário sobre...")
#   data          AAAA-MM-DD            inicio / fim   "19:00" (fim é opcional)
#   modalidade    "On-line, Google Meet"  ou  "Presencial, Salão de Atos"
#   certificacao  curto: "Certificado de horas" (opcional)
#   resumo        1 ou 2 frases: do que se trata e quem pode participar
#   inscricao     link do formulário (opcional)     link   link da reunião (opcional)
#   cartaz        arquivo em static/img/agenda/ (opcional)
#   destaque      false = não aparece no bloco da página inicial (use em reuniões internas)
#   descricao     texto longo (opcional): aparece só em "Saiba mais"; deixe de fora se o resumo bastar
