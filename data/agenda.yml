- id: palestra-mudancas-climaticas-saude-planetaria
  tipo: Palestra
  titulo: "Mudanças Climáticas e Saúde Planetária: eventos extremos, impactos na vida e desafios para o futuro"
  data: 2026-11-16
  inicio: "19:00"
  modalidade: "On-line, Google Meet"
  resumo: "Palestra formativa com a Profa. Dra. Sônia Beatris Balvedi Zakrzevski (URI, Programa de Pós-Graduação em Ecologia). Aberta ao público externo e a toda a equipe do PET."
  cartaz: palestra-mudancas-climaticas.jpg
  descricao: "Sônia Beatris Balvedi Zakrzevski é graduada em Licenciatura em Ciências (Faculdades Integradas de Santa Cruz do Sul, 1992), mestre em Educação (UFSM, 1996) e doutora em Ecologia e Recursos Naturais (UFSCar, 2002). Professora da Universidade Regional Integrada do Alto Uruguai e das Missões (URI), atua na graduação e no Programa de Pós-Graduação em Ecologia. Pesquisa e desenvolve projetos de extensão em educação ambiental, percepção ambiental, mudança climática, formação de professores e Agenda 2030."

- id: integra-climapampa-2026
  tipo: Encontro
  titulo: "Integra ClimaPampa: encontro de saberes e experiências"
  data: 2026-12-05
  inicio: "08:30"
  modalidade: "Presencial, Salão de Atos do Campus Uruguaiana da Unipampa"
  resumo: "Encontro de socialização das experiências dos grupos e eixos do PET-Saúde: Clima, com palestra sobre mudanças climáticas e sociedade."
  inscricao: "https://forms.gle/rEd4f5kBjNwYk9ix9"
  descricao: |
    **Manhã**

    - 08:30: Credenciamento e acolhimento, com coffee break para os inscritos.
    - 09:00: Mesa de abertura, com a coordenação do PET, representante da gestão municipal e representante da Unipampa.
    - 09:30: Mudanças climáticas e sociedade: desafios para a formação e a atuação profissional, com o Prof. Dr. Francisco Eliseu Aquino.

    Intervalo para almoço.

    **Tarde (14:00): socialização das experiências dos grupos e eixos**

    - Eixo 1: Produção do cuidado no território e vigilância em saúde
    - Eixo 2: Acesso à atenção especializada
    - Eixo 3: Comunicação e inovação

