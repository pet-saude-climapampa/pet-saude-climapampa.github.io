titulo_longo: Produção do Cuidado Integral no Território e Inovação em Saúde
periodo: "2026–2028"
descricao_curta: >-
  ClimaPampa (PET-Saúde: Clima, Unipampa): ensino, serviço e comunidade juntos para
  enfrentar os impactos das emergências climáticas na saúde em Uruguaiana/RS.
edital: "Edital SGTES/MS nº 23/2026"
