numeros:
  - {valor: "3", rotulo: "eixos temáticos"}
  - {valor: "5", rotulo: "grupos de aprendizagem tutorial"}
  - {valor: "8", rotulo: "cursos de graduação"}
  - {valor: "24", rotulo: "meses de execução"}

cursos: [Ciência da Computação, Engenharia de Computação, Engenharia de Aquicultura,
         Enfermagem, Fisioterapia, Educação Física, Farmácia, Medicina]

publicos: [Populações ribeirinhas, Campo e águas, Mulheres, Pessoas idosas, Crianças,
           Pessoas com doenças crônicas]

etapas:
  - {titulo: "Planejamento e alinhamento", texto: "Integração da equipe e organização pedagógica dos grupos de trabalho."}
  - {titulo: "Formação em saúde e clima", texto: "Estudos, oficinas e seminários sobre os impactos climáticos na saúde regional."}
  - {titulo: "Territorialização e diagnóstico", texto: "Reconhecimento do território, articulação com a rede de saúde e diagnóstico ambiental e de saúde coletiva."}
  - {titulo: "Intervenção e ações de campo", texto: "Ações educativas com a comunidade e profissionais e estratégias de vigilância em saúde ambiental."}
  - {titulo: "Monitoramento e extensão", texto: "Relatórios, indicadores, artigos, materiais educativos e apresentação dos resultados."}

eixos:
  - n: 1
    cor: azul
    icone: territorio
    curto: "Cuidado no território"
    chamada: "Vigilância em saúde, cartografia social e educação em saúde junto às comunidades."
    titulo: "Produção do cuidado no território e vigilância em saúde"
    objetivo: >-
      Qualificar o cuidado nos territórios com ações interprofissionais de vigilância em saúde,
      educação em saúde e integração entre vigilância e Atenção Primária, com atenção às populações
      ribeirinhas, do campo e das águas, mulheres e pessoas idosas.
    gats: [1, 2]
  - n: 2
    cor: vermelho
    icone: rede
    curto: "Acesso e integralidade"
    titulo: "Acesso à atenção especializada e integralidade do cuidado"
    objetivo: >-
      Qualificar o acesso à atenção especializada e a organização dos fluxos na Rede de Atenção à Saúde,
      garantindo cuidado integral às populações vulneráveis em situações de emergência climática.
    gats: [3, 4]
  - n: 3
    cor: amarelo
    icone: dados
    curto: "Comunicação e inovação"
    titulo: "Comunicação e inovação em saúde"
    objetivo: >-
      Desenvolver soluções digitais, geoespaciais e comunicacionais para análise territorial,
      monitoramento de eventos climáticos e divulgação de informação em saúde, apoiando a vigilância
      e a decisão baseada em evidências.
    gats: [5]

gats:
  - n: 1
    eixo: 1
    foco: "Cartografia social, vigilância territorial e educação em saúde"
    resumo: "Mapeia riscos e vulnerabilidades junto às comunidades e transforma o saber do território em cuidado e vigilância."
    territorio: "ESFs 2, 23 e 7 de Uruguaiana"
    acoes:
      - "Cartografia social e oficinas de mapeamento participativo nas ESFs, escolas e espaços comunitários."
      - "Monitoramento de agravos cruzando os mapas do território com e-SUS APS, SINAN e SIM."
      - "Rodas de conversa, oficinas e materiais educativos acessíveis sobre riscos climáticos."
      - "Planos de cuidado e acompanhamento de pessoas com doenças crônicas e mobilidade reduzida."
      - "Qualificação de agentes comunitários e lideranças locais; estudos de caso e simulações de emergência."
  - n: 2
    eixo: 1
    foco: "Cartografia social, vigilância territorial e educação em saúde"
    resumo: "Atua junto ao GAT 1 na leitura do território, na vigilância de agravos e na educação em saúde com a comunidade."
    territorio: "ESFs 2, 23 e 7 de Uruguaiana"
    acoes:
      - "Pesquisa cartográfica conjunta com os demais grupos e definição das ESFs de referência."
      - "Identificação de grupos prioritários e dos itinerários terapêuticos nos territórios vulneráveis."
      - "Segurança medicamentosa e continuidade do tratamento em eventos climáticos extremos."
      - "Grupo de estudos sobre emergências climáticas, justiça ambiental e determinantes sociais em saúde."
      - "Boletins informativos e alertas comunitários na linguagem e na memória do território."
  - n: 3
    eixo: 2
    foco: "Fluxos de cuidado, referência e contrarreferência"
    resumo: "Fortalece o caminho do cuidado entre a atenção primária e os serviços especializados em situações de emergência climática."
    territorio: "ESFs 17, 7, 14 e 19 e serviços especializados da rede"
    acoes:
      - "Reuniões quinzenais e estudos dirigidos com discussão de casos e situações-problema."
      - "Oficinas de educação permanente com equipes de saúde e defesa civil sobre ondas de calor e frio, regulação e encaminhamento."
      - "Guias rápidos e infográficos sobre vigilância em saúde ambiental."
      - "Linhas de cuidado interprofissionais para agravos relacionados às emergências climáticas."
  - n: 4
    eixo: 2
    foco: "Fluxos de cuidado, referência e contrarreferência"
    resumo: "Trabalha a comunicação entre os pontos da rede de saúde e o acesso equitativo aos serviços especializados."
    territorio: "ESFs 17, 7, 14 e 19 e serviços especializados da rede"
    acoes:
      - "Mapeamento de fluxos entre a atenção primária e a clínica renal, oncologia, pronto-socorro, saúde da mulher, saúde mental e policlínica infantil."
      - "Sensibilização para o uso coordenado de referência e contrarreferência."
      - "Educação permanente para profissionais e gestores da rede."
      - "Produção de materiais didáticos para as equipes."
  - n: 5
    eixo: 3
    foco: "Tecnologias digitais e comunicação para vigiar, decidir e cuidar diante das emergências climáticas"
    foco_texto:
      - "O eixo desenvolve as ferramentas digitais do projeto e os conteúdos que levam a informação a quem cuida e a quem vive no território. A frente tecnológica reúne um geoportal, que integra clima, território, vulnerabilidades e agravos em saúde, e painéis interativos com indicadores ambientais, territoriais e epidemiológicos, para apoiar a vigilância em saúde e as decisões baseadas em evidências."
      - "Outra frente estuda como os eventos climáticos extremos se relacionam com a violência contra mulheres nos territórios da atenção primária, combinando a análise espacial dos dados com entrevistas a mulheres e a profissionais, para indicar áreas prioritárias de vigilância e intervenção."
      - "A partir disso, o eixo produz materiais e tecnologias educativas, como cartilha, guia para profissionais, boxes, jogos, vídeos, podcasts e chatbots, e oferece formação em geoprocessamento, análise espacial e saúde digital para estudantes, profissionais e gestores."
    resumo: "Constrói as ferramentas digitais do projeto — plataforma geoespacial e painéis — e os conteúdos educativos sobre clima, território e proteção de mulheres."
    territorio: "Município de Uruguaiana"
    acoes:
      - "Plataforma geoespacial (geoportal) integrando clima, território, vulnerabilidades e agravos à saúde."
      - "Painéis interativos (dashboards) com indicadores ambientais, territoriais e epidemiológicos."
      - "Mapeamento de áreas expostas a alagamentos, inundações, estiagens e ondas de calor, urbanas e rurais."
      - "Estudo de vulnerabilidades de mulheres em áreas de risco climático, com entrevistas a mulheres e profissionais da APS."
      - "Cartilha, guia para profissionais da APS, boxes educativos, vídeos, podcasts e chatbots."
      - "Formação em geoprocessamento, análise espacial e saúde digital."

