  responsavel_site: "Alexandro Gularte Schäfer"
  email: "alexandro.schafer@unipampa.edu.br"
  responsavel_funcao: "tutor do GAT 5 (Eixo 3), Unipampa"
  desenvolvimento: "Este site foi desenvolvido com apoio de ferramenta de inteligência artificial (Claude Code, Anthropic), com curadoria e revisão da equipe."
