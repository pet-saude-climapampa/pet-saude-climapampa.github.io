    status: andamento
    descricao: "Mapas e camadas territoriais sobre clima, vulnerabilidades socioambientais e saúde em Uruguaiana, para apoiar a vigilância e a decisão no território."
    # equipe: definir
    url: "https://alexandrogschafer.github.io/uruguaiana-clima-saude/"
