# Controle interno dos PROJETOS do GAT 5 (não são atividades isoladas).
# Página: /equipe/gat-5/projetos/  (sem link no menu; só um link discreto no fim da página do GAT 5; não indexada por buscadores).
# status: andamento | planejado | finalizado
# Campos: titulo, status, descricao, equipe (lista de nomes), responsaveis (opcional), periodo (opcional, texto livre), url (opcional), url_rotulo (opcional)
# A equipe inicial foi deduzida da autoria dos trabalhos submetidos de cada projeto: CONFERIR e ajustar.
# Só colocar nomes de quem já autorizou a divulgação do nome.
# ATENÇÃO: a página é pública para quem tiver o link. Não colocar dados pessoais sensíveis nem informações confidenciais.
# Canais do grupo (aparecem na página de projetos quando preenchidos). Só o NOME do grupo/canal; não colocar link de convite.
canais:
  whatsapp: ""   # ex.: "GAT 5 · PET-Saúde Clima"
  slack: ""      # ex.: "#gat5-pet-clima"
# Integrantes do GAT 5 que não têm "gat: 5" no cadastro da equipe (ex.: orientadores de serviço)
integrantes_extra:
  - Francisco Bortoluzzi Neto
# Quem NÃO aparece no gráfico de participação (os tutores responsáveis pelos projetos)
grafico_excluir:
  - Alexandro Gularte Schäfer
  - Lisie Alende Prates
# O gráfico de participação só conta projetos que NÃO estão finalizados.
# Mostrar os nomes das equipes nos cards de projetos e, no gráfico, quais projetos cada pessoa tem?
# false = escondido (os dados continuam aqui e o gráfico mantém só as contagens). true = mostrar tudo.
mostrar_equipes: false
projetos:
  - titulo: "Integra ClimaPampa: encontro de saberes e experiências"
    status: planejado
    tutor: Lisie Alende Prates
    descricao: "Encontro de socialização das experiências dos grupos e eixos do PET-Saúde: Clima, com palestra sobre mudanças climáticas e sociedade. Presencial, em 5 de dezembro de 2026, no Salão de Atos do Campus Uruguaiana da Unipampa."
    # equipe: definir (estudantes ainda não definidos)
  - titulo: "Site do PET-Saúde: Clima (ClimaPampa)"
    tutor: Alexandro Gularte Schäfer
    status: andamento
    descricao: "Site público do projeto, com apresentação, equipe, agenda, notícias, galeria e produtos. No ar desde outubro de 2026 e atualizado continuamente. Código aberto, com versão arquivada no Zenodo (DOI 10.5281/zenodo.23748574)."
    equipe:
      - Alexandro Gularte Schäfer
      - Davi Lopes Lemos
    url: "https://pet-saude-climapampa.github.io/"
    url_rotulo: "Acessar o site"
