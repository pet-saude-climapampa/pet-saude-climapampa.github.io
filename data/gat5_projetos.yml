projetos:
  - titulo: "Site do PET-Saúde: Clima (ClimaPampa)"
    status: andamento
    descricao: "Site público do projeto, com apresentação, equipe, agenda, notícias, galeria e produtos. No ar desde outubro de 2026 e atualizado continuamente. Código aberto, com versão arquivada no Zenodo (DOI 10.5281/zenodo.23748574)."
